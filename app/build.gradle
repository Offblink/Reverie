plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'org.offblink.reverie'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "org.offblink.reverie"
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName "1.0"

        // sherpa AAR 带 4 个 ABI；真机只要 arm64，模拟器用 x86_64（砍掉 v7a/x86 省 APK ~30MB）
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.okhttp
    // sherpa-onnx（端上识别，v1.13.8）：GitHub Release 的 AAR 落仓（maven central 在本机网络不可达）
    implementation files('libs/sherpa-onnx-android-1.13.8.aar')

    testImplementation libs.junit
    testImplementation libs.json
}
